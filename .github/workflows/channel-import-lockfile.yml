name: Generate package lock

on:
  push:
    branches:
      - codex/channel-product-import-mapping
    paths:
      - 'smartstore-bridge/package.json'
      - '.github/workflows/channel-import-lockfile.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartstore-bridge
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/channel-product-import-mapping
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: smartstore-bridge/package-lock.json
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smartstore-bridge/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "build: update package lock for postgres"
            git push origin HEAD:codex/channel-product-import-mapping
          fi
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: channel-import-package-lock
          path: smartstore-bridge/package-lock.json
          if-no-files-found: error
          retention-days: 1
