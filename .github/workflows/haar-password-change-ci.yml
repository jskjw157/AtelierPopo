name: HAAR Password Change CI

on:
  push:
    branches:
      - feat/haar-password-change

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: haar_social_test
          POSTGRES_USER: haar
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haar -d haar_social_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: social-studio

    env:
      NODE_ENV: production
      PORT: '3000'
      APP_BASE_URL: http://127.0.0.1:3000
      DATABASE_URL: postgres://haar:test-password@127.0.0.1:5432/haar_social_test
      DATABASE_SSL: 'false'
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD_HASH: '$2b$10$92IXUNpkjO0rOQ5byMi.Ye4oKoEa3Ro9llC/.og/at2uheWG/igi.'
      SESSION_SECRET: ci-session-secret-at-least-thirty-two-characters
      TOKEN_ENCRYPTION_KEY: abababababababababababababababababababababababababababababababab
      MEDIA_SIGNING_SECRET: ci-media-signing-secret-at-least-thirty-two
      CRON_SECRET: ci-cron-secret-at-least-thirty-two-characters
      UPLOAD_DIR: ./data/password-change-ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Check server syntax
        run: npm run check:syntax

      - name: Run unit tests
        run: npm test

      - name: Build admin app
        run: npm run build

      - name: Verify password change and restart persistence
        shell: bash
        run: |
          set -euo pipefail

          INITIAL_PASSWORD='Initial-password-123!'
          NEW_PASSWORD='New-password-456!'
          export ADMIN_PASSWORD_HASH
          ADMIN_PASSWORD_HASH="$(node --input-type=module -e \
            "import bcrypt from 'bcryptjs'; process.stdout.write(await bcrypt.hash(process.argv[1], 10));" \
            "$INITIAL_PASSWORD")"

          start_app() {
            : > /tmp/haar-password-change.log
            NODE_ENV=development node server/index.js > /tmp/haar-password-change.log 2>&1 &
            APP_PID=$!
            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3000/api/health \
                  | grep -q '"status":"ok"'; then
                return 0
              fi
              if ! kill -0 "$APP_PID" 2>/dev/null; then
                cat /tmp/haar-password-change.log
                return 1
              fi
              sleep 1
            done
            cat /tmp/haar-password-change.log
            return 1
          }

          stop_app() {
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              if ! curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
                return 0
              fi
              sleep 0.25
            done
            echo 'Application did not stop cleanly.' >&2
            return 1
          }

          expect_code() {
            expected="$1"
            actual="$2"
            body_file="$3"
            label="$4"
            echo "$label http=$actual"
            if [[ "$actual" != "$expected" ]]; then
              echo "$label expected HTTP $expected but got $actual" >&2
              cat "$body_file" >&2 || true
              cat /tmp/haar-password-change.log >&2 || true
              exit 1
            fi
          }

          trap '[[ -n "${APP_PID:-}" ]] && kill "$APP_PID" 2>/dev/null || true; cat /tmp/haar-password-change.log 2>/dev/null || true' EXIT
          start_app

          login_code="$(curl -sS -o /tmp/login-initial.json -w '%{http_code}' \
            -c /tmp/cookies.txt \
            -H 'Content-Type: application/json' \
            --data-binary "{\"email\":\"ci@example.com\",\"password\":\"$INITIAL_PASSWORD\"}" \
            http://127.0.0.1:3000/api/auth/login)"
          expect_code 200 "$login_code" /tmp/login-initial.json initial_login

          csrf="$(awk '$6 == "haar_csrf" { value=$7 } END { print value }' /tmp/cookies.txt)"
          if [[ -z "$csrf" ]]; then
            echo 'CSRF cookie was not issued.' >&2
            cat /tmp/cookies.txt >&2 || true
            exit 1
          fi

          change_code="$(curl -sS -o /tmp/change.json -w '%{http_code}' \
            -b /tmp/cookies.txt -c /tmp/cookies.txt \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://127.0.0.1:3000' \
            -H "X-CSRF-Token: $csrf" \
            --data-binary "{\"currentPassword\":\"$INITIAL_PASSWORD\",\"newPassword\":\"$NEW_PASSWORD\",\"confirmPassword\":\"$NEW_PASSWORD\"}" \
            http://127.0.0.1:3000/api/auth/change-password)"
          expect_code 200 "$change_code" /tmp/change.json password_change
          grep -q '"ok":true' /tmp/change.json

          old_code="$(curl -sS -o /tmp/login-old.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data-binary "{\"email\":\"ci@example.com\",\"password\":\"$INITIAL_PASSWORD\"}" \
            http://127.0.0.1:3000/api/auth/login)"
          expect_code 401 "$old_code" /tmp/login-old.json old_password_login

          new_code="$(curl -sS -o /tmp/login-new.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data-binary "{\"email\":\"ci@example.com\",\"password\":\"$NEW_PASSWORD\"}" \
            http://127.0.0.1:3000/api/auth/login)"
          expect_code 200 "$new_code" /tmp/login-new.json new_password_login

          stop_app
          unset APP_PID
          start_app

          persisted_code="$(curl -sS -o /tmp/login-persisted.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data-binary "{\"email\":\"ci@example.com\",\"password\":\"$NEW_PASSWORD\"}" \
            http://127.0.0.1:3000/api/auth/login)"
          expect_code 200 "$persisted_code" /tmp/login-persisted.json restarted_new_password_login

          reset_code="$(curl -sS -o /tmp/login-reset.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data-binary "{\"email\":\"ci@example.com\",\"password\":\"$INITIAL_PASSWORD\"}" \
            http://127.0.0.1:3000/api/auth/login)"
          expect_code 401 "$reset_code" /tmp/login-reset.json restarted_old_password_login

          echo 'Password change, old-password rejection, new-password login, and restart persistence verified.'
