name: Channel Product Import CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'smartstore-bridge/**'
      - '.github/workflows/channel-import-ci.yml'
  push:
    branches:
      - codex/channel-product-import-mapping
    paths:
      - 'smartstore-bridge/**'
      - '.github/workflows/channel-import-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: haar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d haar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/haar_test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/haar_test
      ATELIER_POSTGRES_SSL_MODE: disable
      TZ: UTC
    defaults:
      run:
        working-directory: smartstore-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: smartstore-bridge/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Static checks
        run: npm run check
      - name: PostgreSQL migrator unit test
        run: node --test test/postgres-migrator.test.js
      - name: PostgreSQL schema integration test
        run: node --test test/postgres-channel-import.integration.test.js
      - name: Full test suite
        run: |
          set -euo pipefail
          test -n "$TEST_DATABASE_URL"
          npm test | tee /tmp/full-regression.tap
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const tap = fs.readFileSync('/tmp/full-regression.tap', 'utf8');
          for (const counter of ['fail', 'cancelled', 'skipped', 'todo']) assert.match(tap, new RegExp(`^# ${counter} 0$`, 'm'));
          NODE
      - name: Verify Commerce coverage
        run: npm run commerce:coverage
      - name: Verify SearchAd coverage
        run: npm run searchad:coverage
