name: Export SearchAd resume source
on:
  push:
    branches: [codex/searchad-original-recovery-20260912]
    paths: ['.github/workflows/searchad-resume-source.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked code without credentials
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/source-sha.txt"
          git ls-tree -r HEAD smartstore-bridge .github/workflows > "$RUNNER_TEMP/source-blobs.txt"
          git archive --format=tar HEAD smartstore-bridge .github/workflows > "$RUNNER_TEMP/source.tar"
          cd "$RUNNER_TEMP"
          sha256sum source.tar > source-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: searchad-resume-source
          path: |
            ${{ runner.temp }}/source.tar
            ${{ runner.temp }}/source-sha.txt
            ${{ runner.temp }}/source-blobs.txt
            ${{ runner.temp }}/source-sha256.txt
          retention-days: 1
          if-no-files-found: error
