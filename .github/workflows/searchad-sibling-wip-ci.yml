name: SearchAd sibling lifecycle WIP CI

on:
  push:
    branches:
      - codex/searchad-sibling-wip-20260913
    paths:
      - 'smartstore-bridge/**'
      - '.github/workflows/searchad-sibling-wip-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atelier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atelier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/atelier_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/atelier_test
      ATELIER_POSTGRES_SSL_MODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: smartstore-bridge/package-lock.json
      - name: Install dependencies
        working-directory: smartstore-bridge
        run: npm ci --no-audit --no-fund
      - name: Sibling contract syntax and focused tests
        working-directory: smartstore-bridge
        run: |
          node --check src/naver/searchad/lifecycle/sibling-create-contract.js
          node --test test/searchad-hierarchy-sibling-contract.test.js test/searchad-hierarchy-recipes.test.js test/searchad-hierarchy-validator.test.js
      - name: Sibling PostgreSQL integration if present
        working-directory: smartstore-bridge
        run: |
          test -n "$TEST_DATABASE_URL"
          if test -f test/postgres-searchad-sibling-create.integration.test.js; then
            node --check test/postgres-searchad-sibling-create.integration.test.js
            node --test test/postgres-searchad-sibling-create.integration.test.js
          fi
      - name: Required PostgreSQL regression
        working-directory: smartstore-bridge
        run: node --test test/postgres-*.integration.test.js
      - name: Full regression
        working-directory: smartstore-bridge
        run: npm test
      - name: Static and safety checks
        working-directory: smartstore-bridge
        run: |
          npm run check
          node scripts/searchad-write-safety.mjs
          npm run searchad:coverage
      - name: Migration idempotency
        working-directory: smartstore-bridge
        run: |
          node scripts/postgres-migrate.mjs
          node scripts/postgres-migrate.mjs
