name: HAAR Instagram Product Comment Once

on:
  push:
    branches:
      - ops/haar-approved-instagram-20260912
    paths:
      - '.github/workflows/haar-instagram-product-comment-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  add-product-comment:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Add product information to the existing Instagram post
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$SSH_HOST" && -n "$SSH_USER" && -n "$SSH_PRIVATE_KEY" ]]
          KEY="$(mktemp)"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          chmod 600 "$KEY"

          ssh -i "$KEY" -p "${SSH_PORT:-22}" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          SUDO=""
          if [[ "$(id -u)" != 0 ]]; then SUDO='sudo -n'; fi
          exec 9>/tmp/haar-instagram-product-comment.lock
          flock -n 9 || { echo 'Product comment operation is already running.'; exit 1; }

          $SUDO docker exec -i -w /app app-app-1 node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { query, audit, pool } from './server/db.js';
          import { decryptSecret, safeErrorMessage } from './server/security.js';
          import { graphGet, graphPost } from './server/meta/client.js';

          const variantId = '09964e77-b7b2-5782-8fd7-e9617db85940';
          const mediaId = '17960008077192527';
          const productUrl = 'https://haar.co.kr/product/orbit-silver-earring/43/category/72/display/1/';
          const commentText = `Orbit Silver Earring · 120,000원\n구매 링크 ↓\n${productUrl}`;

          try {
            const variant = (await query('SELECT id,publish_state,external_post_id,permalink FROM post_variants WHERE id=$1',[variantId])).rows[0];
            assert.ok(variant && variant.publish_state==='published' && variant.external_post_id===mediaId,'Published post target changed');

            const connection = (await query("SELECT * FROM social_connections WHERE platform='instagram' AND status='connected'")).rows[0];
            assert.ok(connection && connection.scopes.includes('instagram_manage_comments'),'Instagram comment permission missing');
            const accessToken = decryptSecret(connection.access_token_encrypted);

            const comments = await graphGet(`/${mediaId}/comments`, accessToken, {fields:'id,text,username,timestamp',limit:50});
            let existing = (comments.data||[]).find(item=>(item.text||'').trim()===commentText);
            let created = false;
            if (!existing) {
              const result = await graphPost(`/${mediaId}/comments`, accessToken, {message:commentText});
              assert.ok(result.id,'Instagram did not return a comment ID');
              existing = await graphGet(`/${result.id}`, accessToken, {fields:'id,text,username,timestamp'});
              assert.equal(existing.text,commentText,'Created Instagram comment did not match product text');
              created = true;
            }

            await query('UPDATE post_variants SET link_url=$2, updated_at=NOW() WHERE id=$1',[variantId,productUrl]);
            await audit(null,'post.product_link_added','post_variant',variantId,{source:'user_approved_chat',productUrl,instagramCommentId:existing.id,created});
            console.log('HAAR_PRODUCT_COMMENT_RESULT ' + JSON.stringify({status:created?'created':'already_exists',verified:true,commentId:existing.id,comment:existing.text,productUrl,permalink:variant.permalink}));
          } catch (error) {
            console.error('HAAR_PRODUCT_COMMENT_RESULT ' + JSON.stringify({status:'failed',code:error.code||'PRODUCT_COMMENT_FAILED',metaCode:error.metaCode||null,metaSubcode:error.metaSubcode||null,message:safeErrorMessage(error)}));
            process.exitCode=1;
          } finally {
            await pool.end();
          }
          NODE
          REMOTE
