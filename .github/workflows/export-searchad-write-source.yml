name: Export SearchAd write source

on:
  push:
    branches:
      - codex/searchad-write-execution-v0.7.0
    paths:
      - '.github/workflows/export-searchad-write-source.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/searchad-write-execution-v0.7.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: smartstore-bridge/package-lock.json
      - name: Install dependencies
        working-directory: smartstore-bridge
        run: npm ci --no-audit --no-fund
      - name: Archive source and dependencies
        run: |
          tar --exclude='.git' -czf /tmp/searchad-write-source-with-deps.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: searchad-write-source-with-deps
          path: /tmp/searchad-write-source-with-deps.tar.gz
          if-no-files-found: error
          retention-days: 1
