name: HAAR Meta Ads Select HAAR Account Once
on:
  push:
    branches: [feat/haar-meta-ads-phase1]
    paths: ['.github/workflows/meta-ads-select-haar-account-once.yml']
permissions:
  contents: read
concurrency:
  group: haar-social-studio-hostinger
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Select exact HAAR ad account and verify reads
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh /tmp/haar-ads-select
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/haar_hostinger
          chmod 600 ~/.ssh/haar_hostinger
          ssh -i ~/.ssh/haar_hostinger -p "${SSH_PORT:-22}" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" 'if [ "$(id -u)" = 0 ]; then exec bash -s; else exec sudo -n bash -s; fi' <<'REMOTE' > /tmp/haar-ads-select/report.json
          set -euo pipefail
          APP_DIR=/opt/haar-social-studio/app
          APP_ID=$(docker ps -q --filter label=com.docker.compose.service=app | while read -r id; do
            wd=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$id")
            [ "$wd" = "$APP_DIR" ] && echo "$id"
          done)
          test "$(printf '%s\n' "$APP_ID" | sed '/^$/d' | wc -l)" -eq 1
          docker exec -i "$APP_ID" node --input-type=module - <<'NODE'
          import { pool } from './server/db.js';
          import { adsServices } from './server/meta/ads/instance.js';

          const mask = value => {
            const s=String(value||'');
            if(!s) return null;
            return s.length<=6 ? '***' : s.slice(0,4)+'…'+s.slice(-3);
          };
          const owner=(await pool.query("SELECT id FROM users WHERE role='owner' AND status='active' ORDER BY created_at LIMIT 1")).rows[0];
          if(!owner) throw new Error('No active owner');

          let accounts=await adsServices.auth.accounts(owner.id);
          if(accounts.length===0) accounts=await adsServices.auth.discover(owner.id);
          const matches=accounts.filter(a=>String(a.name||'').trim()==='HAAR 광고 계정');
          if(matches.length!==1) throw new Error(`Expected exactly one HAAR 광고 계정, found ${matches.length}`);
          const selected=await adsServices.auth.select(owner.id,matches[0].external_account_id);

          const status=await adsServices.status(owner.id);
          if(status.executionEnabled) throw new Error('Paid delivery gate unexpectedly enabled');
          const hierarchy=await adsServices.hierarchy(owner.id);
          const pixels=await adsServices.tracking(owner.id);
          const test=await adsServices.testConnection(owner.id);

          const result={
            selectedAccount:{
              id:mask(selected.external_account_id),
              name:selected.name||null,
              currency:selected.currency||null,
              timezone:selected.timezone_name||null,
              accountStatus:selected.account_status??null,
              tasks:Array.isArray(selected.user_tasks)?selected.user_tasks:[]
            },
            connected:Boolean(status.connected),
            readable:Boolean(status.readable),
            managementGranted:Boolean(status.managementGranted),
            executionEnabled:Boolean(status.executionEnabled),
            hierarchy:{
              campaigns:hierarchy.campaigns?.length||0,
              adsets:hierarchy.adsets?.length||0,
              ads:hierarchy.ads?.length||0
            },
            tracking:{
              pixelCount:pixels.length,
              pixels:pixels.slice(0,10).map(p=>({id:mask(p.id),name:p.name||null,lastFiredTime:p.last_fired_time||null}))
            },
            connectionTest:{
              readTestPassed:Boolean(test.readTestPassed),
              writePreflightPassed:Boolean(test.writePreflightPassed)
            },
            verifiedAt:new Date().toISOString()
          };
          console.log(JSON.stringify(result,null,2));
          await pool.end();
          NODE
          REMOTE
          python3 - <<'PY'
          import json
          p='/tmp/haar-ads-select/report.json'
          data=json.load(open(p))
          assert data['selectedAccount']['name']=='HAAR 광고 계정'
          assert data['executionEnabled'] is False
          assert data['connected'] is True and data['readable'] is True
          print('HAAR ad account selected and read verification captured; paid-delivery gate remains closed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: haar-meta-ads-selected-account-verification
          path: /tmp/haar-ads-select/report.json
          retention-days: 7
      - name: Remove SSH material
        if: always()
        run: rm -f ~/.ssh/haar_hostinger
