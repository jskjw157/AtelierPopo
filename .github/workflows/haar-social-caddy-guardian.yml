name: HAAR Social Caddy Guardian

on:
  workflow_dispatch:
  push:
    branches:
      - feat/haar-social-studio-meta-phase1
    paths:
      - 'social-studio/ops/ensure_caddy_route.py'
      - '.github/workflows/haar-social-caddy-guardian.yml'

permissions:
  contents: read

concurrency:
  group: haar-social-caddy-guardian
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SOCIAL_DOMAIN: ${{ secrets.HAAR_SOCIAL_DOMAIN }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate required inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_HOST" && -n "$SSH_USER" && -n "$SSH_PRIVATE_KEY" && -n "$SOCIAL_DOMAIN" ]]
          [[ "$SOCIAL_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/haar_hostinger
          chmod 600 ~/.ssh/haar_hostinger

      - name: Upload route helper
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          printf '%s' "$SOCIAL_DOMAIN" > /tmp/haar-social-domain
          scp -i ~/.ssh/haar_hostinger -P "$PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new \
            social-studio/ops/ensure_caddy_route.py \
            /tmp/haar-social-domain \
            "$SSH_USER@$SSH_HOST:/tmp/"

      - name: Install persistent Caddy route guardian
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/haar_hostinger -p "$PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          SUDO=""
          if [[ "$(id -u)" != "0" ]]; then SUDO="sudo"; fi

          DOMAIN="$(cat /tmp/haar-social-domain)"
          [[ "$DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'Invalid HAAR domain.' >&2; exit 1; }

          $SUDO install -d -m 0755 /usr/local/lib/haar-social-studio
          $SUDO install -d -m 0700 /etc/haar-social-studio
          $SUDO install -d -m 0700 /var/lib/haar-social-studio/caddy-backups
          $SUDO install -m 0755 /tmp/ensure_caddy_route.py \
            /usr/local/lib/haar-social-studio/ensure_caddy_route.py

          cat > /tmp/haar-social-caddy-guard.env <<EOF
          HAAR_SOCIAL_DOMAIN=$DOMAIN
          HAAR_SOCIAL_UPSTREAM=127.0.0.1:3100
          HAAR_CADDY_CONTAINER=fanpulse-caddy
          EOF
          $SUDO install -m 0600 /tmp/haar-social-caddy-guard.env \
            /etc/haar-social-studio/caddy-guard.env

          cat > /tmp/haar-social-caddy-guard <<'GUARD'
          #!/usr/bin/env bash
          set -euo pipefail

          exec 9>/run/lock/haar-social-caddy-guard.lock
          flock -n 9 || exit 0

          source /etc/haar-social-studio/caddy-guard.env
          DOMAIN="$HAAR_SOCIAL_DOMAIN"
          UPSTREAM="$HAAR_SOCIAL_UPSTREAM"
          CADDY_CONTAINER="$HAAR_CADDY_CONTAINER"
          HELPER=/usr/local/lib/haar-social-studio/ensure_caddy_route.py
          BACKUP_DIR=/var/lib/haar-social-studio/caddy-backups

          log() { printf '[haar-social-caddy-guard] %s\n' "$*"; }
          fail() { log "ERROR: $*" >&2; exit 1; }

          [[ "$DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]] || fail 'invalid domain'
          [[ "$UPSTREAM" =~ ^[A-Za-z0-9_.:\[\]-]+$ ]] || fail 'invalid upstream'
          command -v docker >/dev/null 2>&1 || fail 'docker is unavailable'
          command -v python3 >/dev/null 2>&1 || fail 'python3 is unavailable'
          docker inspect "$CADDY_CONTAINER" >/dev/null 2>&1 || fail 'shared Caddy container is missing'
          [[ "$(docker inspect "$CADDY_CONTAINER" --format '{{.State.Running}}')" == true ]] \
            || docker start "$CADDY_CONTAINER" >/dev/null

          curl -fsS --max-time 15 "http://$UPSTREAM/api/health" \
            | grep -q '"status":"ok"' || fail 'local HAAR application health check failed'

          CADDYFILE="$(docker inspect "$CADDY_CONTAINER" \
            --format '{{range .Mounts}}{{if eq .Destination "/etc/caddy/Caddyfile"}}{{.Source}}{{end}}{{end}}')"
          [[ -n "$CADDYFILE" && -f "$CADDYFILE" ]] || fail 'Caddyfile bind-mount source was not found'

          mkdir -p "$BACKUP_DIR"
          chmod 700 "$BACKUP_DIR"
          BACKUP="$BACKUP_DIR/Caddyfile.$(date -u +%Y%m%dT%H%M%SZ).bak"
          cp --preserve=mode,ownership,timestamps "$CADDYFILE" "$BACKUP"
          chmod 600 "$BACKUP"

          RESULT="$(python3 "$HELPER" --file "$CADDYFILE" \
            --domain "$DOMAIN" --upstream "$UPSTREAM")"
          log "route source state: $RESULT"

          IMAGE="$(docker inspect "$CADDY_CONTAINER" --format '{{.Config.Image}}')"
          if ! docker run --rm --network none \
              -v "$CADDYFILE:/etc/caddy/Caddyfile:ro" \
              "$IMAGE" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
            cat "$BACKUP" > "$CADDYFILE"
            docker restart "$CADDY_CONTAINER" >/dev/null || true
            fail 'candidate Caddyfile validation failed; previous configuration restored'
          fi

          # A different deployment may have atomically replaced the host file.
          # If the running container still sees the old inode, restart it so the
          # bind mount is reacquired; otherwise a zero-downtime reload is enough.
          if docker exec "$CADDY_CONTAINER" \
              grep -Fqx "$DOMAIN {" /etc/caddy/Caddyfile 2>/dev/null; then
            docker exec "$CADDY_CONTAINER" \
              caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
          else
            log 'container bind mount is stale; restarting shared Caddy once'
            docker restart "$CADDY_CONTAINER" >/dev/null
          fi

          ACTIVE=false
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 10 http://127.0.0.1:2019/config/apps/http/servers \
                | grep -Fq "$DOMAIN"; then
              ACTIVE=true
              break
            fi
            sleep 2
          done
          [[ "$ACTIVE" == true ]] || fail 'active Caddy configuration does not contain HAAR domain'

          PUBLIC=false
          for attempt in $(seq 1 24); do
            if curl --resolve "$DOMAIN:443:127.0.0.1" \
                -fsS --max-time 20 "https://$DOMAIN/api/health" \
                | grep -q '"status":"ok"'; then
              PUBLIC=true
              break
            fi
            sleep 5
          done
          [[ "$PUBLIC" == true ]] || fail 'HTTPS route did not become healthy'

          find "$BACKUP_DIR" -type f -name 'Caddyfile.*.bak' -printf '%T@ %p\n' \
            | sort -nr | awk 'NR > 20 {print $2}' | xargs -r rm -f
          log 'route and HTTPS health are normal'
          GUARD
          $SUDO install -m 0755 /tmp/haar-social-caddy-guard \
            /usr/local/sbin/haar-social-caddy-guard

          cat > /tmp/haar-social-caddy-guard.service <<'SERVICE'
          [Unit]
          Description=Ensure HAAR Social Studio route in shared Caddy
          After=docker.service network-online.target
          Wants=docker.service network-online.target

          [Service]
          Type=oneshot
          User=root
          ExecStart=/usr/local/sbin/haar-social-caddy-guard
          SERVICE
          $SUDO install -m 0644 /tmp/haar-social-caddy-guard.service \
            /etc/systemd/system/haar-social-caddy-guard.service

          cat > /tmp/haar-social-caddy-guard.timer <<'TIMER'
          [Unit]
          Description=Continuously verify HAAR Social Studio Caddy route

          [Timer]
          OnBootSec=30s
          OnUnitActiveSec=60s
          AccuracySec=10s
          RandomizedDelaySec=5s
          Persistent=true
          Unit=haar-social-caddy-guard.service

          [Install]
          WantedBy=timers.target
          TIMER
          $SUDO install -m 0644 /tmp/haar-social-caddy-guard.timer \
            /etc/systemd/system/haar-social-caddy-guard.timer

          $SUDO systemctl daemon-reload
          $SUDO systemctl enable --now haar-social-caddy-guard.timer
          $SUDO systemctl start haar-social-caddy-guard.service
          $SUDO systemctl is-active --quiet haar-social-caddy-guard.timer
          $SUDO systemctl is-failed --quiet haar-social-caddy-guard.service && exit 1 || true

          curl -fsS --max-time 30 "https://$DOMAIN/api/health" \
            | grep -q '"status":"ok"'

          rm -f \
            /tmp/ensure_caddy_route.py \
            /tmp/haar-social-domain \
            /tmp/haar-social-caddy-guard.env \
            /tmp/haar-social-caddy-guard \
            /tmp/haar-social-caddy-guard.service \
            /tmp/haar-social-caddy-guard.timer
          REMOTE

      - name: Verify from an external runner
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 30 "https://$SOCIAL_DOMAIN/api/health")"
          printf '%s\n' "$body"
          printf '%s' "$body" | grep -q '"status":"ok"'
