name: Apply smartstore-bridge v0.4.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-v040.yml
      - .tmp/smartstore-bridge-v0.4.0-changes.tar.xz
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: apply-smartstore-bridge-v040
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'codex/v0.4.0-trigger'
    name: Verify and commit v0.4.0
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out event revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify and apply source archive
        shell: bash
        run: |
          set -euo pipefail
          xz --test .tmp/smartstore-bridge-v0.4.0-changes.tar.xz
          tar -tJf .tmp/smartstore-bridge-v0.4.0-changes.tar.xz
          tar -xJf .tmp/smartstore-bridge-v0.4.0-changes.tar.xz -C smartstore-bridge
          node -e "const p=require('./smartstore-bridge/package.json'); if(p.version!=='0.4.0') throw new Error('unexpected version: '+p.version)"

      - name: Install and verify
        working-directory: smartstore-bridge
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock --no-audit --no-fund
          npm run check
          npm test
          npm run commerce:coverage

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-v040.yml
          rm -rf .tmp
          git add -A smartstore-bridge .github/workflows/apply-v040.yml .tmp
          git diff --cached --check
          git commit -m "feat: add Naver Commerce full-operation gateway v0.4.0"
          git push origin HEAD:main
          echo "### Applied smartstore-bridge v0.4.0" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
