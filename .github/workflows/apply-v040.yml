name: Apply smartstore-bridge v0.4.0

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: apply-smartstore-bridge-v040
  cancel-in-progress: false

jobs:
  apply:
    if: startsWith(github.head_ref, 'codex/v0.4.0-trigger')
    name: Verify and commit v0.4.0
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out pull-request revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_HEAD_REF}"
          parts=(00 01 02 03 04 05 06 07 08 09 10 11 12)
          expected=(
            80a8996a0a0045486aa676feeea04d874e5eaed8290e908c747e0834d30edd2f
            5e868b44a031f9c080fd494ac0e3597c4d8c232d71d6ef1e02a8d45e8432ab76
            f8cb593912c4465170fa9022d83ab20387e39b5f1434f87d70308d2949485f96
            aa7f6e88e55ceea90abe3e4084b1c8ab96505159d1973c20c9d25b33f96ffc72
            d35eeb7d6ae0843dcab7faeacb280f8907ba53156c3ed88e24f0d260b955a0ca
            cf45ec87c22117496ca1db381aca4dd27dce86aa7d899e72af9d5b446b69e139
            a5f32d96eba8ba0c8f2a4b2c94f73f0daa8d53ccc1d9dc59ed0e864873dcf5d6
            4fe9b53541129141ab0db41c08a743fa8dba1601f04413d5ed2fbc58ca57b7c9
            02a46d876542eed86ef68adcc84a18f2586d13e371d9067e7331fb087a45663b
            ca651451643516d5b50c5924229b9e36fa8d7110049188516f950b254ae94bd0
            a19116f2913db24429a14d76b40c6acc05503ee203184d3504888fee83743d5c
            c3ca6affac9e3642becbdcda13fed8bfc1f9faa071ba7e6a14e2ce2567c285f7
            a2fb948e051a4bf39c7645eb98e5f639a4f21a661ac6e09d67620af58500e046
          )
          mkdir -p /tmp/v040-parts
          for index in "${!parts[@]}"; do
            part="${parts[$index]}"
            git show "origin/${GITHUB_HEAD_REF}:.tmp/v040.b64.part.${part}" > "/tmp/v040-parts/${part}"
            actual="$(sha256sum "/tmp/v040-parts/${part}" | awk '{print $1}')"
            bytes="$(wc -c < "/tmp/v040-parts/${part}")"
            echo "part=${part} bytes=${bytes} sha256=${actual}"
            test "${actual}" = "${expected[$index]}"
          done
          cat /tmp/v040-parts/* \
            | tr -d '\r\n ' \
            | base64 --decode \
            > /tmp/smartstore-bridge-v0.4.0-changes.tar.xz
          echo "e8c346636fa3141540622f45954bf5ebaf9a6f5a6943fd9c9b3272721733a66d  /tmp/smartstore-bridge-v0.4.0-changes.tar.xz" \
            | sha256sum --check --strict
          xz --test /tmp/smartstore-bridge-v0.4.0-changes.tar.xz
          test "$(tar -tJf /tmp/smartstore-bridge-v0.4.0-changes.tar.xz | wc -l)" -eq 30

      - name: Apply v0.4.0 on current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          tar -xJf /tmp/smartstore-bridge-v0.4.0-changes.tar.xz -C smartstore-bridge
          node -e "const p=require('./smartstore-bridge/package.json'); if(p.version!=='0.4.0') throw new Error('unexpected version: '+p.version)"

      - name: Install and verify
        working-directory: smartstore-bridge
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock --no-audit --no-fund
          npm run check
          npm test
          npm run commerce:coverage

      - name: Commit verified source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-v040.yml
          rm -rf .tmp
          git add -A -- smartstore-bridge .github/workflows/apply-v040.yml
          git diff --cached --check
          git commit -m "feat: add Naver Commerce full-operation gateway v0.4.0"
          git push origin HEAD:main
          echo "### Applied smartstore-bridge v0.4.0" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
