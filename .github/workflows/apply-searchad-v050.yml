name: Apply SearchAd foundation v0.5.0

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: apply-searchad-v050-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  verify-and-apply:
    if: github.head_ref == 'codex/v0.5.0-searchad-foundation-impl'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct and verify patch archive
        shell: bash
        run: |
          set -euo pipefail
          parts=(00 01 02 03 04 05 06 07 08)
          expected=(
            4fd5277890ceb0a0961b196c2aec2930ea9d6f844fe549d71287da8d5b66fc57
            7544131fa559ae44c5b6cdf6d18fb5398483888541aa104a22615140844bd72a
            1d683d155aa4a13139b831584a97190d43172148b7bfe99f4181bbd9a34ec803
            60e37d9f04461c91688a1462a261af0aceaf5ddef13dd76a353cc8a61a361124
            733ef35cbebf3239520883227a497a3f2949c34e88c9d2f7ae865b4938495621
            fca39ddcae76c9166a505da7cba9e2066b9a1984616282cf418ce3415a704f80
            6c42cda47bb3c31ffc769cee9c55d22eb29bf6b0468a75de665838f59520a9e8
            eec25c069b7092e166bf0617b642a83c00bd6061845c15bba4c97e024bf81faf
            865f76871b768e7c66fa67d6df465cbaa36df294c01afe1b1c1e62e72c257978
          )
          for index in "${!parts[@]}"; do
            part="${parts[$index]}"
            file=".tmp/v050.b64.part.${part}"
            test -f "$file"
            actual="$(sha256sum "$file" | awk '{print $1}')"
            echo "part=${part} bytes=$(wc -c < "$file") sha256=${actual}"
            test "$actual" = "${expected[$index]}"
          done
          cat .tmp/v050.b64.part.* \
            | tr -d '\r\n ' \
            | base64 --decode \
            > /tmp/searchad-v0.5.0-foundation.patch.tar.xz
          echo "2a51b7de7bab5e7d65683ebf6c9de7b26c083649f366b80632de5d4e90278bd6  /tmp/searchad-v0.5.0-foundation.patch.tar.xz" \
            | sha256sum --check --strict
          xz --test /tmp/searchad-v0.5.0-foundation.patch.tar.xz
          test "$(tar -tJf /tmp/searchad-v0.5.0-foundation.patch.tar.xz | grep -v '/$' | wc -l)" -eq 31

      - name: Apply foundation source
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/searchad-v0.5.0-foundation.patch.tar.xz -C .
          node -e "const p=require('./smartstore-bridge/package.json'); if(p.version!=='0.5.0') throw new Error('unexpected version: '+p.version)"

      - name: Install dependencies
        working-directory: smartstore-bridge
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Pin and compile official SearchAd specification
        working-directory: smartstore-bridge
        run: npm run searchad:spec:sync

      - name: Static checks
        working-directory: smartstore-bridge
        run: npm run check

      - name: Full test suite
        working-directory: smartstore-bridge
        run: npm test

      - name: Verify Commerce coverage
        working-directory: smartstore-bridge
        run: npm run commerce:coverage

      - name: Verify SearchAd coverage
        working-directory: smartstore-bridge
        run: npm run searchad:coverage

      - name: Commit verified implementation to staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .tmp
          rm -f .github/workflows/apply-searchad-v050.yml
          git add -A -- smartstore-bridge .tmp .github/workflows/apply-searchad-v050.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: add SearchAd specification and signed read foundation v0.5.0"
          git push origin HEAD:${{ github.head_ref }}
          echo "### SearchAd foundation v0.5.0 verified" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
