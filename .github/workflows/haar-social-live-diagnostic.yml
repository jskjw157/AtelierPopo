name: HAAR Social Live Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - feat/haar-social-studio-meta-phase1
    paths:
      - '.github/workflows/haar-social-live-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SOCIAL_DOMAIN: ${{ secrets.HAAR_SOCIAL_DOMAIN }}
    steps:
      - name: Validate diagnostic inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_HOST" && -n "$SSH_USER" && -n "$SSH_PRIVATE_KEY" && -n "$SOCIAL_DOMAIN" ]]

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/haar_hostinger
          chmod 600 ~/.ssh/haar_hostinger

      - name: Inspect live DNS, containers, proxy and TLS
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/haar_hostinger -p "$PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<REMOTE
          set +e
          SUDO=""
          if [[ "\$(id -u)" != "0" ]]; then SUDO="sudo"; fi
          DOMAIN='$SOCIAL_DOMAIN'

          redact() {
            sed -E \
              -e 's/((access|refresh)[_-]?token|app[_-]?secret|client[_-]?secret|cron[_-]?secret|password|authorization|signed_request)([=: ]+)[^ ,;\"}]+/\1\3[REDACTED]/Ig' \
              -e 's/Bearer[[:space:]]+[A-Za-z0-9._~+\/-]+/Bearer [REDACTED]/Ig'
          }

          echo '=== timestamp ==='
          date -Is
          echo '=== dns ==='
          getent ahostsv4 "\$DOMAIN" 2>&1 | head -n 10

          echo '=== listeners ==='
          \$SUDO ss -ltnp 2>&1 | grep -E ':(80|443|3100)[[:space:]]' | redact || true

          echo '=== containers ==='
          \$SUDO docker ps --format 'name={{.Names}} status={{.Status}} ports={{.Ports}}' | grep -E '^(name=)?(app-app-1|app-database-1|fanpulse-caddy)' || true
          for container in app-app-1 app-database-1 fanpulse-caddy; do
            echo "--- \$container ---"
            \$SUDO docker inspect "\$container" --format 'running={{.State.Running}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restarts={{.RestartCount}} started={{.State.StartedAt}}' 2>&1 || true
          done

          echo '=== local_app_health ==='
          curl -sS --connect-timeout 8 --max-time 20 -D /tmp/local.headers \
            -o /tmp/local.body -w 'exit_http=%{http_code} remote=%{remote_ip}\n' \
            http://127.0.0.1:3100/api/health 2>/tmp/local.error
          local_status=\$?
          echo "curl_exit=\$local_status"
          cat /tmp/local.headers 2>/dev/null | head -n 20 | redact
          cat /tmp/local.body 2>/dev/null | head -c 1500 | redact
          echo
          cat /tmp/local.error 2>/dev/null | tail -c 1000 | redact
          echo

          echo '=== caddy_domain_loaded ==='
          printf 'host_file_block_count='
          grep -Fxc "\$DOMAIN {" /docker/fanpulse-edge/Caddyfile 2>/dev/null || true
          printf 'active_config_contains_domain='
          if curl -fsS --max-time 15 http://127.0.0.1:2019/config/apps/http/servers 2>/dev/null | grep -Fq "\$DOMAIN"; then echo true; else echo false; fi
          \$SUDO docker exec fanpulse-caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile 2>&1 | tail -n 20 | redact

          echo '=== loopback_https_health ==='
          curl --resolve "\$DOMAIN:443:127.0.0.1" -sS --connect-timeout 8 --max-time 25 \
            -D /tmp/loop.headers -o /tmp/loop.body \
            -w 'http=%{http_code} remote=%{remote_ip} verify=%{ssl_verify_result}\n' \
            "https://\$DOMAIN/api/health" 2>/tmp/loop.error
          loop_status=\$?
          echo "curl_exit=\$loop_status"
          cat /tmp/loop.headers 2>/dev/null | head -n 20 | redact
          cat /tmp/loop.body 2>/dev/null | head -c 1500 | redact
          echo
          cat /tmp/loop.error 2>/dev/null | tail -c 1500 | redact
          echo

          echo '=== public_https_health ==='
          curl -sS --connect-timeout 8 --max-time 25 \
            -D /tmp/public.headers -o /tmp/public.body \
            -w 'http=%{http_code} remote=%{remote_ip} verify=%{ssl_verify_result}\n' \
            "https://\$DOMAIN/api/health" 2>/tmp/public.error
          public_status=\$?
          echo "curl_exit=\$public_status"
          cat /tmp/public.headers 2>/dev/null | head -n 20 | redact
          cat /tmp/public.body 2>/dev/null | head -c 1500 | redact
          echo
          cat /tmp/public.error 2>/dev/null | tail -c 1500 | redact
          echo

          echo '=== certificate ==='
          timeout 20 openssl s_client -connect 127.0.0.1:443 -servername "\$DOMAIN" </dev/null 2>/tmp/tls.error \
            | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>&1 | redact
          cat /tmp/tls.error 2>/dev/null | tail -c 1000 | redact

          echo '=== recent_caddy_domain_logs ==='
          \$SUDO docker logs --since 30m fanpulse-caddy 2>&1 | grep -F "\$DOMAIN" | tail -n 100 | redact || true

          echo '=== recent_app_logs ==='
          \$SUDO docker logs --since 30m app-app-1 2>&1 | tail -n 100 | redact || true

          echo '=== diagnostic_exit_summary ==='
          echo "local=\$local_status loopback_https=\$loop_status public_https=\$public_status"
          REMOTE
