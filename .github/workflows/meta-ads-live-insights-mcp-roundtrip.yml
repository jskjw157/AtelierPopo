name: HAAR Meta Ads Live Insights MCP Roundtrip
on:
  push:
    branches: [feat/haar-meta-ads-phase1]
    paths: ['.github/workflows/meta-ads-live-insights-mcp-roundtrip.yml']
permissions:
  contents: read
concurrency:
  group: haar-social-studio-hostinger
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Sync live read-only insights and read them back through MCP
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh /tmp/haar-insights-mcp
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/haar_hostinger
          chmod 600 ~/.ssh/haar_hostinger
          ssh -i ~/.ssh/haar_hostinger -p "${SSH_PORT:-22}" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" 'if [ "$(id -u)" = 0 ]; then exec bash -s; else exec sudo -n bash -s; fi' <<'REMOTE' > /tmp/haar-insights-mcp/report.json
          set -euo pipefail
          APP_DIR=/opt/haar-social-studio/app
          APP_ID=$(docker ps -q --filter label=com.docker.compose.service=app | while read -r id; do
            wd=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$id")
            [ "$wd" = "$APP_DIR" ] && echo "$id"
          done)
          test "$(printf '%s\n' "$APP_ID" | sed '/^$/d' | wc -l)" -eq 1
          docker exec -i "$APP_ID" node --input-type=module - <<'NODE'
          import express from 'express';
          import http from 'node:http';
          import { randomBytes } from 'node:crypto';
          import { pool } from './server/db.js';
          import { adsServices } from './server/meta/ads/instance.js';
          import { createAdsMcpRouter } from './server/meta/ads/mcp.js';

          const owner=(await pool.query("SELECT id FROM users WHERE role='owner' AND status='active' ORDER BY created_at LIMIT 1")).rows[0];
          if(!owner) throw new Error('No active owner');
          const status=await adsServices.status(owner.id);
          if(status.executionEnabled) throw new Error('Paid delivery gate unexpectedly enabled');
          if(status.selectedAccount?.name!=='HAAR 광고 계정') throw new Error('HAAR account not selected');

          const dateInZone=(date)=>{
            const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date);
            const o=Object.fromEntries(parts.map(p=>[p.type,p.value]));
            return `${o.year}-${o.month}-${o.day}`;
          };
          const until=dateInZone(new Date());
          const since=dateInZone(new Date(Date.now()-6*86400000));
          const synced=await adsServices.insights.sync(owner.id,{since,until,level:'account'});
          if(!synced.capturedAt) throw new Error('Insights sync did not persist a capture');

          const secret=randomBytes(32).toString('hex');
          const app=express();
          app.use(express.json({limit:'2mb'}));
          app.use('/mcp',createAdsMcpRouter({
            bearerToken:secret,actorId:owner.id,appBaseUrl:'https://social.haarapp.tech',services:adsServices
          }));
          const server=await new Promise((resolve,reject)=>{
            const s=app.listen(3002,'127.0.0.1',()=>resolve(s));s.on('error',reject);
          });
          const rpc=body=>new Promise((resolve,reject)=>{
            const data=JSON.stringify(body);
            const req=http.request({hostname:'127.0.0.1',port:3002,path:'/mcp',method:'POST',headers:{
              host:'social.haarapp.tech',authorization:'Bearer '+secret,accept:'application/json, text/event-stream',
              'content-type':'application/json','content-length':Buffer.byteLength(data)
            }},res=>{
              let chunks='';res.setEncoding('utf8');res.on('data',c=>chunks+=c);
              res.on('end',()=>{if(res.statusCode!==200)return reject(new Error('MCP HTTP '+res.statusCode));try{resolve(JSON.parse(chunks));}catch(e){reject(e);}});
            });req.on('error',reject);req.end(data);
          });
          try{
            const r=await rpc({jsonrpc:'2.0',id:1,method:'tools/call',params:{name:'haar_ads_insights',arguments:{since,until,level:'account'}}});
            if(r.error||r.result?.isError) throw new Error('MCP insights call failed');
            const viaMcp=JSON.parse(r.result.content[0].text);
            if(viaMcp.since!==since||viaMcp.until!==until||viaMcp.level!=='account') throw new Error('MCP date range mismatch');
            if(!viaMcp.capturedAt) throw new Error('MCP did not read persisted insight snapshot');
            if(viaMcp.accountId!==synced.accountId||viaMcp.currency!==synced.currency) throw new Error('MCP insight account mismatch');

            console.log(JSON.stringify({
              selectedAccount:{name:status.selectedAccount.name,currency:status.selectedAccount.currency,timezone:status.selectedAccount.timezone_name},
              range:{since,until,level:'account'},
              syncedRows:synced.rows.length,
              mcpRows:viaMcp.rows.length,
              capturedAt:viaMcp.capturedAt,
              attribution:viaMcp.attribution,
              rows:viaMcp.rows,
              executionEnabled:false,
              metaMutationPerformed:false,
              productionMcpConfigChanged:false
            },null,2));
          } finally {
            await new Promise(resolve=>server.close(resolve));
            await pool.end();
          }
          NODE
          REMOTE
          python3 - <<'PY'
          import json
          p='/tmp/haar-insights-mcp/report.json'
          d=json.load(open(p))
          assert d['executionEnabled'] is False
          assert d['metaMutationPerformed'] is False
          assert d['productionMcpConfigChanged'] is False
          assert d['syncedRows']==d['mcpRows']
          assert d['capturedAt']
          print('Live Meta insights -> DB snapshot -> MCP roundtrip passed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: haar-meta-ads-live-insights-mcp-roundtrip
          path: /tmp/haar-insights-mcp/report.json
          retention-days: 7
      - name: Remove SSH material
        if: always()
        run: rm -f ~/.ssh/haar_hostinger
