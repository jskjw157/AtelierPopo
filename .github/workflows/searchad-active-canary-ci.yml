permissions:
  contents: read

jobs:
  active-canary-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: smartstore-bridge/package-lock.json
      - name: Install dependencies
        working-directory: smartstore-bridge
        run: npm ci --no-audit --no-fund
      - name: Active Canary and SearchAd HTTP contract tests
        working-directory: smartstore-bridge
        run: |
          set -euo pipefail
          shopt -s nullglob
          TESTS=(test/searchad-active-canary-*.test.js test/searchad-gateway-active-canary.test.js test/searchad-http-*.test.js)
          DOMAIN_TESTS=(
            test/searchad-hierarchy-*.test.js
            test/searchad-lifecycle-*.test.js
            test/searchad-reporting-*.test.js
            test/searchad-circuit-*.test.js
            test/searchad-automation-*.test.js
          )
          TESTS+=("${DOMAIN_TESTS[@]}")
          for file in \
            test/searchad-passive-evidence.test.js \
            test/searchad-activation-service.test.js \
            test/searchad-activation-runtime.test.js \
            test/searchad-activation-guard.test.js \
            test/searchad-account-control.test.js \
            test/searchad-write-activation.test.js \
            test/searchad-write-access.test.js; do
            if [[ -f "$file" ]]; then TESTS+=("$file"); fi
          done
          node --test "${TESTS[@]}"
      - name: Runtime wiring syntax
        working-directory: smartstore-bridge
        run: |
          node --check src/bootstrap-v05.js
          node --check src/http/server-v05.js
          node --check src/naver/searchad/canary/runtime-production.js
          node --check src/naver/searchad/activation/runtime-production.js
          if [[ -f src/naver/searchad/lifecycle/runtime-production.js ]]; then node --check src/naver/searchad/lifecycle/runtime-production.js; fi
          if [[ -f src/naver/searchad/reporting/runtime-production.js ]]; then node --check src/naver/searchad/reporting/runtime-production.js; fi
          if [[ -f src/naver/searchad/circuit/runtime-production.js ]]; then node --check src/naver/searchad/circuit/runtime-production.js; fi
          if [[ -f src/naver/searchad/automation/runtime-production.js ]]; then node --check src/naver/searchad/automation/runtime-production.js; fi

  searchad-activation-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: smartstore-bridge/package-lock.json
      - name: Install dependencies
        working-directory: smartstore-bridge
        run: npm ci --no-audit --no-fund
      - name: Passive evidence and activation focused suite
        working-directory: smartstore-bridge
        run: |
          node --test \
            test/searchad-passive-evidence.test.js \
            test/searchad-activation-service.test.js \
            test/searchad-activation-runtime.test.js \
            test/searchad-activation-guard.test.js \
            test/searchad-account-control.test.js \
            test/searchad-write-activation.test.js \
            test/searchad-write-access.test.js \
            test/searchad-http-activation.test.js
      - name: Production SearchAd mutation gates default OFF
        working-directory: smartstore-bridge
        run: |
          node --input-type=module <<'NODE'
          import { loadSearchAdConfig } from './src/naver/searchad/config.js';
          const config = loadSearchAdConfig({});
          const gates = ['allowWrites', 'allowCreates', 'allowBatchWrites', 'allowRollbacks', 'allowDeletes', 'allowActiveCanary'];
          for (const gate of gates) {
            if (config[gate] !== false) throw new Error(`${gate} must default to false`);
          }
          if (config.automationMode !== 'observe') throw new Error('automationMode must default to observe');
          console.log('SearchAd mutation defaults verified OFF; automation default verified observe.');
          NODE

  active-canary-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atelier_canary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d atelier_canary_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/atelier_canary_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: smartstore-bridge/package-lock.json
      - name: Install dependencies
        working-directory: smartstore-bridge
        run: npm ci --no-audit --no-fund
      - name: PostgreSQL SearchAd persistence contracts
        working-directory: smartstore-bridge
        run: |
          set -euo pipefail
          TESTS=(
            test/postgres-searchad-active-canary.integration.test.js
            test/postgres-searchad-activation.integration.test.js
          )
          for file in \
            test/postgres-searchad-lifecycle.integration.test.js \
            test/postgres-searchad-reporting.integration.test.js \
            test/postgres-searchad-circuit.integration.test.js \
            test/postgres-searchad-automation.integration.test.js; do
            if [[ -f "$file" ]]; then TESTS+=("$file"); fi
          done
          node --test --test-concurrency=1 "${TESTS[@]}"

  searchad-write-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: smartstore-bridge/package-lock.json
      - name: Install dependencies
        working-directory: smartstore-bridge
        run: npm ci --no-audit --no-fund
      - name: Existing SearchAd write regression
        working-directory: smartstore-bridge
        run: node --test test/searchad-write-*.test.js
