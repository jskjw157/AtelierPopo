name: SearchAd Active Canary CI

on:
  push:
    branches:
      - codex/searchad-active-canary-20260910
    paths:
      - 'smartstore-bridge/src/naver/searchad/canary/**'
      - 'smartstore-bridge/src/naver/searchad/activation/**'
      - 'smartstore-bridge/src/naver/searchad/capability.js'
      - 'smartstore-bridge/src/naver/searchad/gateway.js'
      - 'smartstore-bridge/src/naver/searchad/write/**'
      - 'smartstore-bridge/src/bootstrap-v05.js'
      - 'smartstore-bridge/src/http/server-v05.js'
      - 'smartstore-bridge/src/http/searchad-access-control.js'
      - 'smartstore-bridge/src/http/searchad-write-runtime.js'
      - 'smartstore-bridge/src/http/routes-searchad-canary.js'
      - 'smartstore-bridge/src/http/routes-searchad-write-v3.js'
      - 'smartstore-bridge/src/http/routes-searchad-activation.js'
      - 'smartstore-bridge/src/http/openapi-searchad-canary.js'
      - 'smartstore-bridge/src/http/openapi-searchad-activation.js'
      - 'smartstore-bridge/.env.searchad-write.example'
      - 'smartstore-bridge/test/helpers/searchad-write-http-fixture.js'
      - 'smartstore-bridge/test/searchad-active-canary-*.test.js'
      - 'smartstore-bridge/test/searchad-passive-evidence.test.js'
      - 'smartstore-bridge/test/searchad-activation-*.test.js'
      - 'smartstore-bridge/test/searchad-account-control.test.js'
      - 'smartstore-bridge/test/searchad-write-activation.test.js'
      - 'smartstore-bridge/test/searchad-write-access.test.js'
      - 'smartstore-bridge/test/searchad-gateway-active-canary.test.js'
      - 'smartstore-bridge/test/searchad-http-*.test.js'
      - 'smartstore-bridge/test/postgres-searchad-active-canary.integration.test.js'
      - 'smartstore-bridge/test/postgres-searchad-activation.integration.test.js'
      - 'smartstore-bridge/migrations/postgres/**'
      - '.github/workflows/searchad-active-canary-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'smartstore-bridge/src/naver/searchad/canary/**'
      - 'smartstore-bridge/src/naver/searchad/activation/**'
      - 'smartstore-bridge/src/naver/searchad/capability.js'
      - 'smartstore-bridge/src/naver/searchad/gateway.js'
      - 'smartstore-bridge/src/naver/searchad/write/**'
      - 'smartstore-bridge/src/bootstrap-v05.js'
      - 'smartstore-bridge/src/http/server-v05.js'
      - 'smartstore-bridge/src/http/searchad-access-control.js'
      - 'smartstore-bridge/src/http/searchad-write-runtime.js'
      - 'smartstore-bridge/src/http/routes-searchad-canary.js'
      - 'smartstore-bridge/src/http/routes-searchad-write-v3.js'
      - 'smartstore-bridge/src/http/routes-searchad-activation.js'
      - 'smartstore-bridge/src/http/openapi-searchad-canary.js'
      - 'smartstore-bridge/src/http/openapi-searchad-activation.js'
      - 'smartstore-bridge/.env.searchad-write.example'
      - 'smartstore-bridge/test/helpers/searchad-write-http-fixture.js'
      - 'smartstore-bridge/test/searchad-active-canary-*.test.js'
      - 'smartstore-bridge/test/searchad-passive-evidence.test.js'
      - 'smartstore-bridge/test/searchad-activation-*.test.js'
      - 'smartstore-bridge/test/searchad-account-control.test.js'
      - 'smartstore-bridge/test/searchad-write-activation.test.js'
      - 'smartstore-bridge/test/searchad-write-access.test.js'
      - 'smartstore-bridge/test/searchad-gateway-active-canary.test.js'
      - 'smartstore-bridge/test/searchad-http-*.test.js'
      - 'smartstore-bridge/test/postgres-searchad-active-canary.integration.test.js'
      - 'smartstore-bridge/test/postgres-searchad-activation.integration.test.js'
      - 'smartstore-bridge/migrations/postgres/**'
      - '.github/workflows/searchad-active-canary-ci.yml'

permissions:
  contents: read

jobs:
  active-canary-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: smartstore-bridge/package-lock.json
      - name: Install dependencies
        working-directory: smartstore-bridge
        run: npm ci --no-audit --no-fund
      - name: Active Canary and SearchAd HTTP contract tests
        working-directory: smartstore-bridge
        run: |
          set -euo pipefail
          TESTS=(test/searchad-active-canary-*.test.js test/searchad-gateway-active-canary.test.js test/searchad-http-*.test.js)
          for file in \
            test/searchad-passive-evidence.test.js \
            test/searchad-activation-service.test.js \
            test/searchad-activation-runtime.test.js \
            test/searchad-activation-guard.test.js \
            test/searchad-account-control.test.js \
            test/searchad-write-activation.test.js \
            test/searchad-write-access.test.js; do
            if [[ -f "$file" ]]; then TESTS+=("$file"); fi
          done
          node --test "${TESTS[@]}"
      - name: Runtime wiring syntax
        working-directory: smartstore-bridge
        run: |
          node --check src/bootstrap-v05.js
          node --check src/http/server-v05.js
          node --check src/naver/searchad/canary/runtime-production.js
          if [[ -f src/naver/searchad/activation/runtime-production.js ]]; then node --check src/naver/searchad/activation/runtime-production.js; fi

  active-canary-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atelier_canary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d atelier_canary_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/atelier_canary_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: smartstore-bridge/package-lock.json
      - name: Install dependencies
        working-directory: smartstore-bridge
        run: npm ci --no-audit --no-fund
      - name: PostgreSQL Active Canary and activation persistence contracts
        working-directory: smartstore-bridge
        run: |
          set -euo pipefail
          TESTS=(test/postgres-searchad-active-canary.integration.test.js)
          if [[ -f test/postgres-searchad-activation.integration.test.js ]]; then TESTS+=(test/postgres-searchad-activation.integration.test.js); fi
          node --test --test-concurrency=1 "${TESTS[@]}"

  searchad-write-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: smartstore-bridge/package-lock.json
      - name: Install dependencies
        working-directory: smartstore-bridge
        run: npm ci --no-audit --no-fund
      - name: Existing SearchAd write regression
        working-directory: smartstore-bridge
        run: node --test test/searchad-write-*.test.js
