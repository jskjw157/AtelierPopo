name: SearchAd continuation bundle diagnostic

on:
  push:
    branches:
      - codex/searchad-continuation-20260909
    paths:
      - '.searchad-bootstrap/**'
      - '.github/workflows/searchad-continuation-bootstrap.yml'

permissions:
  contents: read

jobs:
  diagnose-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Locate invalid base64 boundary without applying bundle
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            .searchad-bootstrap/chunk-00
            .searchad-bootstrap/chunk-01
            .searchad-bootstrap/chunk-02
            .searchad-bootstrap/chunk-03
            .searchad-bootstrap/chunk-04
            .searchad-bootstrap/chunk-05
            .searchad-bootstrap/chunk-06
            .searchad-bootstrap/chunk-07
            .searchad-bootstrap/chunk-08a
            .searchad-bootstrap/chunk-08b
            .searchad-bootstrap/chunk-09a
            .searchad-bootstrap/chunk-09b
            .searchad-bootstrap/chunk-10a
            .searchad-bootstrap/chunk-10b
            .searchad-bootstrap/chunk-11a
            .searchad-bootstrap/chunk-11b
          )

          cumulative=0
          for p in "${parts[@]}"; do
            test -s "$p" || { echo "missing bootstrap part: $p" >&2; exit 1; }
            bytes="$(wc -c < "$p" | tr -d ' ')"
            sha="$(sha256sum "$p" | awk '{print $1}')"
            invalid_count="$(LC_ALL=C grep -ao '[^A-Za-z0-9+/=]' "$p" 2>/dev/null | wc -l | tr -d ' ')"
            equals_count="$(LC_ALL=C grep -ao '=' "$p" 2>/dev/null | wc -l | tr -d ' ')"
            prefix="$(head -c 24 "$p")"
            suffix="$(tail -c 24 "$p")"
            cumulative=$((cumulative + bytes))
            echo "PART=$p BYTES=$bytes MOD4=$((bytes % 4)) CUMULATIVE=$cumulative CUM_MOD4=$((cumulative % 4)) INVALID=$invalid_count EQUALS=$equals_count SHA256=$sha"
            echo "PART_PREFIX=$prefix"
            echo "PART_SUFFIX=$suffix"
            if [ "$invalid_count" -gt 0 ]; then
              echo "INVALID_OFFSETS_BEGIN=$p"
              LC_ALL=C grep -abo '[^A-Za-z0-9+/=]' "$p" | head -20 || true
              echo "INVALID_OFFSETS_END=$p"
            fi
            if [ "$equals_count" -gt 0 ]; then
              echo "PADDING_OFFSETS_BEGIN=$p"
              LC_ALL=C grep -abo '=' "$p" | head -20 || true
              echo "PADDING_OFFSETS_END=$p"
            fi
          done

          cat "${parts[@]}" > /tmp/searchad-patches.raw.b64
          echo "TOTAL_BYTES=$(wc -c < /tmp/searchad-patches.raw.b64 | tr -d ' ')"
          echo "TOTAL_MOD4=$(( $(wc -c < /tmp/searchad-patches.raw.b64) % 4 ))"
          echo "TOTAL_INVALID=$(LC_ALL=C grep -ao '[^A-Za-z0-9+/=]' /tmp/searchad-patches.raw.b64 2>/dev/null | wc -l | tr -d ' ')"
          echo "TOTAL_PADDING=$(LC_ALL=C grep -ao '=' /tmp/searchad-patches.raw.b64 2>/dev/null | wc -l | tr -d ' ')"
          echo 'FIRST_GLOBAL_INVALID_OFFSETS'
          LC_ALL=C grep -abo '[^A-Za-z0-9+/=]' /tmp/searchad-patches.raw.b64 | head -20 || true
          echo 'FIRST_GLOBAL_PADDING_OFFSETS'
          LC_ALL=C grep -abo '=' /tmp/searchad-patches.raw.b64 | head -20 || true

          set +e
          base64 --decode /tmp/searchad-patches.raw.b64 > /tmp/searchad-patches.partial.tar.gz 2>/tmp/base64.err
          decode_status=$?
          set -e
          echo "BASE64_DECODE_STATUS=$decode_status"
          cat /tmp/base64.err || true
          echo "PARTIAL_DECODE_BYTES=$(wc -c < /tmp/searchad-patches.partial.tar.gz | tr -d ' ')"
          echo "PARTIAL_DECODE_SHA256=$(sha256sum /tmp/searchad-patches.partial.tar.gz | awk '{print $1}')"

          # This job is evidence gathering only. It must never apply, commit, or push the bundle.
          exit 0
