name: SearchAd continuation chunk subset diagnostic

on:
  push:
    branches:
      - codex/searchad-continuation-20260909
    paths:
      - '.github/workflows/searchad-continuation-bootstrap.yml'

permissions:
  contents: read

jobs:
  search-subsets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_B64_SHA256: 7c55eaf56e78b65acc12a821bf2d0db47e7a075dd8e412c5153693aa75f8eb44
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Exhaustively search order-preserving chunk subsets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          expected = '7c55eaf56e78b65acc12a821bf2d0db47e7a075dd8e412c5153693aa75f8eb44'
          names = [
              '.searchad-bootstrap/chunk-00',
              '.searchad-bootstrap/chunk-01',
              '.searchad-bootstrap/chunk-02',
              '.searchad-bootstrap/chunk-03',
              '.searchad-bootstrap/chunk-04',
              '.searchad-bootstrap/chunk-05',
              '.searchad-bootstrap/chunk-06',
              '.searchad-bootstrap/chunk-07',
              '.searchad-bootstrap/chunk-08a',
              '.searchad-bootstrap/chunk-08b',
              '.searchad-bootstrap/chunk-09a',
              '.searchad-bootstrap/chunk-09b',
              '.searchad-bootstrap/chunk-10a',
              '.searchad-bootstrap/chunk-10b',
              '.searchad-bootstrap/chunk-11a',
              '.searchad-bootstrap/chunk-11b',
          ]
          blobs = [Path(name).read_bytes() for name in names]
          suffixes = [b'', b'=', b'==', b'\n']
          found = []
          checked = 0

          # DFS with hashlib state copies avoids rebuilding long prefixes at every leaf.
          def walk(i, state, chosen, total_len):
              global checked
              if i == len(names):
                  checked += 1
                  for suffix in suffixes:
                      h = state.copy()
                      if suffix:
                          h.update(suffix)
                      if h.hexdigest() == expected:
                          found.append((chosen.copy(), suffix, total_len + len(suffix)))
                  return
              walk(i + 1, state, chosen, total_len)
              included = state.copy()
              included.update(blobs[i])
              chosen.append(names[i])
              walk(i + 1, included, chosen, total_len + len(blobs[i]))
              chosen.pop()

          walk(0, hashlib.sha256(), [], 0)
          print(f'CHECKED_SUBSETS={checked}')
          print(f'MATCH_COUNT={len(found)}')
          for idx, (chosen, suffix, total_len) in enumerate(found, 1):
              print(f'MATCH_{idx}_LENGTH={total_len}')
              print(f'MATCH_{idx}_SUFFIX={suffix!r}')
              for name in chosen:
                  print(f'MATCH_{idx}_PART={name}')

          if found:
              print('DIAGNOSTIC_RESULT=EXPECTED_HASH_RECONSTRUCTABLE_FROM_CURRENT_CHUNKS')
          else:
              print('DIAGNOSTIC_RESULT=EXPECTED_HASH_NOT_AN_ORDER_PRESERVING_SUBSET')
          PY

          echo 'Diagnostic only: no decode, git apply, commit, push, ref update, or live SearchAd call.'
