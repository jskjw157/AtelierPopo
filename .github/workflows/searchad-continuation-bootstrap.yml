name: SearchAd continuation bundle diagnostic

on:
  push:
    branches:
      - codex/searchad-continuation-20260909
    paths:
      - '.searchad-bootstrap/**'
      - '.github/workflows/searchad-continuation-bootstrap.yml'

permissions:
  contents: read

jobs:
  diagnose-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_B64_SHA256: 7c55eaf56e78b65acc12a821bf2d0db47e7a075dd8e412c5153693aa75f8eb44
      EXPECTED_TGZ_SHA256: ce87f97bef1b39e5c566e8c1441cd1186ddc883feb354ab999c20ff485db1eaf
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Diagnose immutable bundle transport only
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            .searchad-bootstrap/chunk-00
            .searchad-bootstrap/chunk-01
            .searchad-bootstrap/chunk-02
            .searchad-bootstrap/chunk-03
            .searchad-bootstrap/chunk-04
            .searchad-bootstrap/chunk-05
            .searchad-bootstrap/chunk-06
            .searchad-bootstrap/chunk-07
            .searchad-bootstrap/chunk-08a
            .searchad-bootstrap/chunk-08b
            .searchad-bootstrap/chunk-09a
            .searchad-bootstrap/chunk-09b
            .searchad-bootstrap/chunk-10a
            .searchad-bootstrap/chunk-10b
            .searchad-bootstrap/chunk-11a
            .searchad-bootstrap/chunk-11b
          )
          for p in "${parts[@]}"; do
            test -s "$p" || { echo "missing bootstrap part: $p" >&2; exit 1; }
          done

          cat "${parts[@]}" > /tmp/searchad-patches.raw.b64
          tr -d '\r\n\t ' < /tmp/searchad-patches.raw.b64 > /tmp/searchad-patches.normalized.b64

          raw_bytes="$(wc -c < /tmp/searchad-patches.raw.b64 | tr -d ' ')"
          normalized_bytes="$(wc -c < /tmp/searchad-patches.normalized.b64 | tr -d ' ')"
          whitespace_bytes="$((raw_bytes - normalized_bytes))"
          raw_sha="$(sha256sum /tmp/searchad-patches.raw.b64 | awk '{print $1}')"
          normalized_sha="$(sha256sum /tmp/searchad-patches.normalized.b64 | awk '{print $1}')"

          echo "RAW_B64_BYTES=$raw_bytes"
          echo "NORMALIZED_B64_BYTES=$normalized_bytes"
          echo "TRANSPORT_WHITESPACE_BYTES=$whitespace_bytes"
          echo "RAW_B64_SHA256=$raw_sha"
          echo "NORMALIZED_B64_SHA256=$normalized_sha"
          echo "EXPECTED_B64_SHA256=$EXPECTED_B64_SHA256"

          base64 --decode /tmp/searchad-patches.normalized.b64 > /tmp/searchad-patches.tar.gz
          tgz_bytes="$(wc -c < /tmp/searchad-patches.tar.gz | tr -d ' ')"
          tgz_sha="$(sha256sum /tmp/searchad-patches.tar.gz | awk '{print $1}')"
          echo "TGZ_BYTES=$tgz_bytes"
          echo "TGZ_SHA256=$tgz_sha"
          echo "EXPECTED_TGZ_SHA256=$EXPECTED_TGZ_SHA256"

          echo 'BUNDLE_MEMBERS_BEGIN'
          tar -tzf /tmp/searchad-patches.tar.gz | sort
          echo 'BUNDLE_MEMBERS_END'

          if [ "$tgz_sha" != "$EXPECTED_TGZ_SHA256" ]; then
            echo 'DIAGNOSTIC_RESULT=TGZ_MISMATCH_DO_NOT_APPLY' >&2
            exit 1
          fi
          if [ "$normalized_sha" = "$EXPECTED_B64_SHA256" ]; then
            echo 'DIAGNOSTIC_RESULT=WHITESPACE_ONLY_TRANSPORT_MUTATION'
          else
            echo 'DIAGNOSTIC_RESULT=BINARY_INTACT_WRAPPER_DIFFERS'
          fi

      - name: Assert diagnostic has no publication capability
        shell: bash
        run: |
          set -euo pipefail
          echo 'Diagnostic workflow intentionally performs no git apply, commit, push, or branch update.'
