name: SearchAd continuation bundle diagnostic

on:
  push:
    branches:
      - codex/searchad-continuation-20260909
    paths:
      - '.searchad-bootstrap/**'
      - '.github/workflows/searchad-continuation-bootstrap.yml'

permissions:
  contents: read

jobs:
  diagnose-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Locate invalid base64 boundary without applying bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, tarfile, io

          parts = [
              '.searchad-bootstrap/chunk-00',
              '.searchad-bootstrap/chunk-01',
              '.searchad-bootstrap/chunk-02',
              '.searchad-bootstrap/chunk-03',
              '.searchad-bootstrap/chunk-04',
              '.searchad-bootstrap/chunk-05',
              '.searchad-bootstrap/chunk-06',
              '.searchad-bootstrap/chunk-07',
              '.searchad-bootstrap/chunk-08a',
              '.searchad-bootstrap/chunk-08b',
              '.searchad-bootstrap/chunk-09a',
              '.searchad-bootstrap/chunk-09b',
              '.searchad-bootstrap/chunk-10a',
              '.searchad-bootstrap/chunk-10b',
              '.searchad-bootstrap/chunk-11a',
              '.searchad-bootstrap/chunk-11b',
          ]
          allowed = set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          cumulative = 0
          blobs = []
          for name in parts:
              data = Path(name).read_bytes()
              if not data:
                  raise SystemExit(f'missing/empty bootstrap part: {name}')
              blobs.append(data)
              cumulative += len(data)
              invalid = [(i, b) for i, b in enumerate(data) if b not in allowed]
              padding = [i for i, b in enumerate(data) if b == ord('=')]
              print(f'PART={name} BYTES={len(data)} MOD4={len(data)%4} CUMULATIVE={cumulative} CUM_MOD4={cumulative%4} INVALID={len(invalid)} EQUALS={len(padding)} SHA256={hashlib.sha256(data).hexdigest()}')
              print(f'PART_PREFIX={data[:24]!r}')
              print(f'PART_SUFFIX={data[-24:]!r}')
              if invalid:
                  print(f'INVALID_OFFSETS={name}:{invalid[:20]}')
              if padding:
                  print(f'PADDING_OFFSETS={name}:{padding[:20]}')

          raw = b''.join(blobs)
          invalid = [(i, b) for i, b in enumerate(raw) if b not in allowed]
          padding = [i for i, b in enumerate(raw) if b == ord('=')]
          print(f'TOTAL_BYTES={len(raw)}')
          print(f'TOTAL_MOD4={len(raw)%4}')
          print(f'TOTAL_INVALID={len(invalid)}')
          print(f'TOTAL_PADDING={len(padding)}')
          print(f'RAW_B64_SHA256={hashlib.sha256(raw).hexdigest()}')
          print(f'FIRST_GLOBAL_INVALID={invalid[:20]}')
          print(f'FIRST_GLOBAL_PADDING={padding[:20]}')

          try:
              decoded = base64.b64decode(raw, validate=True)
          except Exception as exc:
              print(f'BASE64_VALIDATE_ERROR={type(exc).__name__}:{exc}')
              # Also decode only the maximal valid prefix before the first obvious structural fault when possible.
              decoded = b''
          else:
              print(f'BASE64_DECODE_STATUS=0')
              print(f'TGZ_BYTES={len(decoded)}')
              print(f'TGZ_SHA256={hashlib.sha256(decoded).hexdigest()}')
              try:
                  with tarfile.open(fileobj=io.BytesIO(decoded), mode='r:gz') as tf:
                      print('BUNDLE_MEMBERS_BEGIN')
                      for member in sorted(tf.getnames()):
                          print(member)
                      print('BUNDLE_MEMBERS_END')
              except Exception as exc:
                  print(f'TAR_VALIDATE_ERROR={type(exc).__name__}:{exc}')
          PY

          echo 'Diagnostic workflow intentionally performs no git apply, commit, push, or branch update.'
