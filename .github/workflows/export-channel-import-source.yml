name: Export channel import source

on:
  push:
    branches:
      - codex/v0.6.0-channel-import-exec
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: channel-import-source
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
