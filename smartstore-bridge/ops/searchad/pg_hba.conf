# Unix sockets also require credentials. Only the two dedicated roles are admitted.
local   all       searchad_admin                  scram-sha-256
local   all       searchad_owner                  scram-sha-256
local   all       all                             reject
hostnossl all     all              0.0.0.0/0      reject
hostnossl all     all              ::/0           reject
hostssl all      searchad_admin   0.0.0.0/0      scram-sha-256
hostssl all      searchad_admin   ::/0           scram-sha-256
hostssl all      searchad_owner   0.0.0.0/0      scram-sha-256
hostssl all      searchad_owner   ::/0           scram-sha-256
host    all      all              0.0.0.0/0      reject
host    all      all              ::/0           reject
