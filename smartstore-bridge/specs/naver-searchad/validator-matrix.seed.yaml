matrix:
  - id: shopping-conversion-autobid
    campaignTp: SHOPPING
    adgroupTp: SHOPPING_MALL_PRODUCT
    entityType: adgroup
    operations:
      - create
      - update
    createSupported: true
    updateSupported: true
    allowedFields:
      - autobidStrategy
    requiredFields:
      - autobidStrategy
    conversionRequired: true
    contractRequired: false
    capabilityRequired: adgroup.autobid.shopping_conversion
    validatorVersion: 1
    effectiveFrom: 2025-10-15
    officialEvidence:
      - https://naver.github.io/searchad-apidoc/release/2025/10/15/release-note/

  - id: power-link-image-extension
    campaignTp: WEB_SITE
    entityType: adExtension
    subtype: POWER_LINK_IMAGE
    operations:
      - create
    createSupported: true
    updateSupported: capability
    deleteSupported: capability
    requiredOwnerTypes:
      - adgroup
    requiredFields:
      - ownerId
      - type
      - adExtension.imagePath
    imageRules:
      acceptedMimeTypes:
        - image/jpeg
        - image/jpg
        - image/png
      maxDecodedBytes: 5242880
      width: 214
      height: 214
      minItems: 1
      maxItems: 1
      dataUriHeaderRequired: true
    capabilityRequired: adExtension.powerLinkImage.create
    validatorVersion: 1
    effectiveFrom: 2025-06-25
    officialEvidence:
      - https://naver.github.io/searchad-apidoc/release/2025/06/25/release-note/

  - id: image-sub-links-extension
    campaignTp: WEB_SITE
    entityType: adExtension
