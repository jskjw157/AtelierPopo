    operations:
      - create
    createSupported: true
    updateSupported: capability
    deleteSupported: capability
    requiredOwnerTypes:
      - adgroup
    requiredFields:
      - ownerId
      - type
      - adExtension
    imageRules:
      acceptedMimeTypes:
        - image/jpeg
        - image/jpg
        - image/png
      maxDecodedBytes: 5242880
      width: 214
      height: 214
      minItems: 1
      maxItems: 3
      dataUriHeaderRequired: true
    capabilityRequired: adExtension.imageSubLinks.create
    validatorVersion: 1
    effectiveFrom: 2025-06-25
    officialEvidence:
      - https://naver.github.io/searchad-apidoc/release/2025/06/25/release-note/

